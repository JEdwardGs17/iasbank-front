<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>IAS Bank</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="IAS Bank - Core de transferencias" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved (or system) theme before Angular boots, avoiding a flash of the wrong theme.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('iasbank-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
