<form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
  <p class="hint">
    Límite actual de <strong>{{ account().accountNumber }}</strong
    >: {{ account().dailyLimit | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}. El nuevo límite
    aplica a las transferencias siguientes.
  </p>

  <div class="field">
    <label for="dailyLimit">Nuevo límite diario (COP)</label>
    <input
      id="dailyLimit"
      class="input"
      formControlName="dailyLimit"
      type="number"
      min="1"
      step="1"
    />
    @if (form.controls.dailyLimit.invalid && form.controls.dailyLimit.touched) {
      <span class="error">El límite debe ser mayor a cero</span>
    }
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Guardar límite</button>
  </div>
</form>
