<div class="layout" [class.sidebar-open]="sidebarOpen()">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo"><app-icon name="bank" /></span>
      <div>
        <strong>IAS Bank</strong>
        <small>Core de transferencias</small>
      </div>
    </div>

    <nav aria-label="Navegación principal">
      @for (section of navigation; track section.title) {
        <span class="section-title">{{ section.title }}</span>
        @for (item of section.items; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="activeLinkOptions"
            (click)="sidebarOpen.set(false)"
          >
            <app-icon [name]="item.icon" />
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <button type="button" class="theme-toggle" (click)="theme.toggle()">
      <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
      {{ theme.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}
    </button>
  </aside>

  <div class="sidebar-backdrop" (click)="sidebarOpen.set(false)"></div>

  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="btn btn-ghost btn-sm"
        aria-label="Abrir menú"
        (click)="sidebarOpen.set(true)"
      >
        <app-icon name="menu" />
      </button>
      <strong>IAS Bank</strong>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>

<app-toast-container />
